name: levora
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Core ──────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  go_router: ^13.2.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  provider: ^6.1.2

  # ── Firebase ──────────────────────────────────
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.0

  # ── Camera / Vision ───────────────────────────
  camera: ^0.11.4
  hand_landmarker: ^2.2.0
  image: ^4.1.7

  # ── AI / Sound Detection ──────────────────────
  tflite_flutter: ^0.12.1
  record: ^5.1.2
  flutter_foreground_task: ^8.13.0

  # ── Accessibility ─────────────────────────────
  flutter_tts: ^4.0.2
  vibration: ^2.0.0
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.2.0
  torch_light: ^1.0.0

  # ── Bluetooth ─────────────────────────────────
  flutter_blue_plus: ^1.31.0

  # ── Notifications ─────────────────────────────
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.4

  # ── Files / PDF ───────────────────────────────
  open_filex: ^4.3.4
  pdf: ^3.10.8
  path_provider: ^2.1.4

  # ── Permissions ───────────────────────────────
  permission_handler: ^11.3.1

  # ── Video ─────────────────────────────────────
  video_player: ^2.8.3
  chewie: ^1.7.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/icon/
    - assets/videos/VDOS/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
