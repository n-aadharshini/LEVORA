name: levora
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Core ──────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.0
  go_router: ^13.2.0
  shared_preferences: ^2.2.3

  # ── Firebase ──────────────────────────────────
  firebase_core: ^2.27.0
  cloud_firestore: ^4.15.0
  firebase_auth: ^4.17.0

  # ── Camera / Vision ───────────────────────────
  camera: ^0.10.5+9
  image: ^4.1.7
  google_mlkit_pose_detection: ^0.11.0

  # ── AI / Sound Detection ──────────────────────
  tflite_flutter: ^0.11.0
  record: ^5.1.2
  flutter_local_notifications: ^17.2.3 # ← add here
  flutter_foreground_task: ^8.13.0 # ← add here
  path_provider: ^2.1.4 # ← add here

  # ── Accessibility ─────────────────────────────
  flutter_tts: ^4.0.2
  vibration: ^2.0.0
  geolocator: ^11.0.0
  url_launcher: ^6.2.0

  # ── Permissions ───────────────────────────────
  permission_handler: ^11.3.1

  # ── Video ─────────────────────────────────────
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/models/yamnet.tflite
    - assets/models/yamnet_labels.txt
    - assets/signs/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
